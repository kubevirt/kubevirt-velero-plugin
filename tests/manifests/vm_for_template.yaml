apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: test-vm-for-template
spec:
  dataVolumeTemplates:
  - metadata:
      name: test-vm-for-template-dv
    spec:
      pvc:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: {{KVP_STORAGE_CLASS}}
      source:
        blank: {}
  runStrategy: Halted
  template:
    metadata:
      creationTimestamp: null
      name: test-vm-for-template
    spec:
      domain:
        devices:
          disks:
          - disk:
              bus: virtio
            name: volume0
        machine:
          type: q35
        resources:
          requests:
            memory: 256M
      terminationGracePeriodSeconds: 0
      volumes:
      - dataVolume:
          name: test-vm-for-template-dv
        name: volume0
